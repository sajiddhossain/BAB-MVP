<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAB · Me</title>
<style>
  :root{
    --bg:#0e1322; --panel:#161d30; --panel2:#1d2740; --ink:#eef2fb; --muted:#98a4c2; --soft:#c3ccdf;
    --line:#293450; --accent:#ff9f45; --accent2:#ffd17a;
    --power:#ff9f45; --sharpen:#24b6b0; --restore:#8b83f5; --care:#e86a92;
    --powerb:rgba(255,159,69,.14); --sharpenb:rgba(36,182,176,.14); --restoreb:rgba(139,131,245,.16); --careb:rgba(232,106,146,.14);
    --menstrual:rgba(232,106,146,.20); --follicular:rgba(36,182,176,.16);
    --ovulation:rgba(255,209,122,.20); --luteal:rgba(139,131,245,.18);
    --shadow:0 12px 34px rgba(0,0,0,.38);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#eef1f9; --panel:#ffffff; --panel2:#f1f4fc; --ink:#151d2f; --muted:#5c6a86; --soft:#3d4a61;
      --line:#e3e8f4; --shadow:0 12px 34px rgba(30,45,90,.10);
      --powerb:rgba(255,159,69,.13); --sharpenb:rgba(36,182,176,.12); --restoreb:rgba(139,131,245,.13); --careb:rgba(232,106,146,.12);}
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;padding:14px 12px 40px}

  .demo{max-width:820px;margin:0 auto 16px;background:var(--panel);border:1px dashed var(--line);
    border-radius:14px;padding:13px 15px}
  .demo h6{margin:0 0 8px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:850}
  .demo .row{display:flex;flex-wrap:wrap;gap:7px}
  .demo button{border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:999px;
    padding:8px 13px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:.12s}
  .demo button:hover{border-color:var(--accent)}
  .demo button[aria-pressed="true"]{border-color:var(--accent);background:var(--powerb);color:var(--accent)}
  .demo p{margin:9px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}

  .phone{max-width:400px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:26px;
    box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:700px}
  .top{padding:16px 16px 6px}
  .top h1{margin:0;font-size:22px;font-weight:850;letter-spacing:-.02em}
  .top .s{font-size:12.5px;color:var(--muted)}
  .body{flex:1;padding:10px 16px 20px;overflow:auto}
  .tabs{display:flex;border-top:1px solid var(--line);background:var(--panel)}
  .tabs button{flex:1;background:none;border:none;color:var(--muted);font:inherit;font-size:11px;font-weight:750;
    padding:11px 4px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
  .tabs button .i{font-size:19px;line-height:1}
  .tabs button.on{color:var(--accent)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px}
  .card h3{margin:0 0 3px;font-size:16px;font-weight:850}
  .card .k{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:850}
  .card p.d{margin:4px 0 0;font-size:13.5px;color:var(--soft);line-height:1.5}

  /* stage 1 — collecting */
  .fill{margin-top:13px}
  .fill .bar{display:flex;gap:3px}
  .fill .bar i{flex:1;height:9px;border-radius:3px;background:var(--line)}
  .fill .bar i.on{background:var(--accent)}
  .fill .cnt{margin-top:9px;font-size:13px;color:var(--soft)}
  .fill .cnt b{color:var(--accent)}
  .dots{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:13px}
  .dots span{aspect-ratio:1;border-radius:7px;background:var(--panel2);border:1px solid var(--line)}
  .dots span.f{background:var(--powerb);border-color:var(--accent)}

  /* reading trend */
  .trend{width:100%;height:86px;margin-top:6px}
  .legendline{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}

  /* signal chips */
  .sig{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px}
  .sig button{border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:999px;
    padding:8px 13px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;min-height:40px;transition:.12s}
  .sig button[aria-pressed="true"]{border-color:var(--accent);background:var(--powerb);color:var(--accent)}

  .chart{width:100%;height:170px}
  .legend{display:flex;flex-wrap:wrap;gap:11px;margin-top:9px;font-size:11px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

  .phase{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
  .phase div{border:1px solid var(--line);border-radius:11px;padding:9px 5px;text-align:center}
  .phase .n{font-size:9.5px;color:var(--muted);font-weight:700;line-height:1.2}
  .phase .v{font-size:16px;font-weight:850;margin-top:3px}

  /* insights */
  .ins{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:10px}
  .ins .t{font-size:13.5px;color:var(--soft);line-height:1.55}
  .ins .t b{color:var(--ink)}
  .ins .fb{display:flex;gap:7px;margin-top:11px}
  .ins .fb button{flex:1;border:1.5px solid var(--line);background:var(--panel);color:var(--muted);
    border-radius:10px;padding:9px;font:inherit;font-size:12.5px;font-weight:750;cursor:pointer;min-height:40px}
  .ins .fb button:hover{border-color:var(--accent);color:var(--ink)}
  .ins .fb button.picked{border-color:var(--sharpen);background:var(--sharpenb);color:var(--sharpen)}
  .caveat{background:var(--restoreb);border:1px solid var(--line);border-left:3px solid var(--restore);
    border-radius:11px;padding:12px 13px;font-size:13px;color:var(--soft);line-height:1.5;margin-bottom:12px}
  .caveat b{color:var(--restore)}

  .story{border:1.5px dashed var(--line);border-radius:16px;padding:15px;text-align:center}
  .story h3{margin:0 0 4px;font-size:16px}
  .story p{margin:0 0 12px;font-size:13px;color:var(--muted)}
  .story button{width:100%;border:none;border-radius:13px;padding:14px;font:inherit;font-weight:850;font-size:14.5px;
    cursor:pointer;color:#241300;background:linear-gradient(135deg,var(--accent),var(--accent2));min-height:48px}
  .locked{opacity:.5}
  .note{max-width:820px;margin:16px auto 0;font-size:12.5px;color:var(--muted);line-height:1.6;text-align:center}
</style>
</head>
<body>

<div class="demo">
  <h6>Demo · the same tab at three points in her journey</h6>
  <div class="row" id="switch"></div>
  <p id="why"></p>
</div>

<div class="phone">
  <div class="top">
    <h1>Me</h1>
    <div class="s" id="sub"></div>
  </div>
  <div class="body" id="view"></div>
  <div class="tabs">
    <button><span class="i">☀️</span>Today</button>
    <button><span class="i">🗺️</span>Journey</button>
    <button class="on"><span class="i">📈</span>Me</button>
  </div>
</div>

<p class="note">The hardest problem in the product: for three weeks there is nothing to show —
and that's exactly when she decides whether it's worth her time.</p>

<script>
(function(){

  /* ── her reading trend: a shape, never a number (§7) ──
     Deliberately drawn as "how closely she reads herself", rising — not as "the gap",
     falling. Same data, but a descending line reads as "I'm getting worse" to a
     13-year-old, and this is the one chart that must never feel like a verdict. */
  function trend(vals){
    var w=340,h=86,pad=8,n=vals.length,min=0,max=1;
    var pts=vals.map(function(v,i){
      return [pad+(w-pad*2)*(i/(n-1)), h-pad-(h-pad*2)*((v-min)/(max-min))];
    });
    var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
    return '<svg class="trend" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" '+
      'aria-label="How closely your prediction matched your body, week by week — getting closer">'+
      '<path d="'+d+' L '+(w-pad)+' '+(h-pad)+' L '+pad+' '+(h-pad)+' Z" fill="var(--sharpenb)"/>'+
      '<path d="'+d+'" fill="none" stroke="var(--sharpen)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
      pts.map(function(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="var(--sharpen)"/>';}).join('')+
      '</svg>';
  }

  /* ── signal over the cycle, with phase bands behind ── */
  var PHASES=[['menstrual',0,5],['follicular',5,12],['ovulation',12,16],['luteal',16,29]];
  function chart(series){
    var w=340,h=170,pad=10,n=series.length;
    var bands='', cyc=29, cycles=Math.ceil(n/cyc);
    for(var c=0;c<cycles;c++){
      PHASES.forEach(function(p){
        var a=c*cyc+p[1], b=Math.min(c*cyc+p[2],n);
        if(a>=n) return;
        var x1=pad+(w-pad*2)*(a/(n-1)), x2=pad+(w-pad*2)*(b/(n-1));
        bands+='<rect x="'+x1.toFixed(1)+'" y="0" width="'+Math.max(0,x2-x1).toFixed(1)+'" height="'+h+'" fill="var(--'+p[0]+')"/>';
      });
    }
    var pts=series.map(function(v,i){
      return [pad+(w-pad*2)*(i/(n-1)), h-pad-(h-pad*2)*((v-1)/4)];
    });
    var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
    return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" '+
      'aria-label="Your signal across the weeks, with cycle phases shaded behind">'+bands+
      '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
      '</svg>';
  }

  /* deterministic sample data */
  function series(days,dip){
    var out=[],s=20260721;
    function rnd(){ s=(s*1103515245+12345)&0x7fffffff; return (s/0x7fffffff)-0.5; }
    for(var d=0;d<days;d++){
      var cd=d%29, base=3.5;
      if(cd<5) base-=0.9; else if(cd<12) base+=0.9; else if(cd<16) base+=1.1;
      else if(cd>=26) base-=1.2;
      if(dip && d>=21 && d<=27) base-=0.9;   // exam week
      out.push(Math.max(1,Math.min(5,base+rnd()*0.7)));
    }
    return out;
  }

  function insight(emoji,text,id){
    return '<div class="ins"><div class="t">'+emoji+' '+text+'</div>'+
      '<div class="fb" data-ins="'+id+'">'+
      '<button data-v="yes">👍 That sounds like me</button>'+
      '<button data-v="no">🤔 Doesn\'t fit</button>'+
      '</div></div>';
  }

  var CAVEAT='<div class="caveat"><b>These are ideas, not facts.</b> You\'re the expert on you: '+
    'keep the ones that feel true, and question the ones that don\'t.</div>';

  var STAGES={
    /* ── weeks 1–3 ── */
    collecting:{
      label:'Weeks 1–3 · Collecting',
      sub:'Week 2 · 9 check-ins so far',
      why:'The honest answer to "she has no data yet" is <b>not</b> to invent insights on nine days. '+
           'So the empty state becomes a visible count — the void turns from failure ("there\'s nothing here") '+
           'into progress ("8 to go"). It\'s the one game-like mechanic the product can afford, because it '+
           'rewards showing up, not performing.',
      html:function(){
        var dots='';
        for(var i=0;i<21;i++) dots+='<span class="'+(i<9?'f':'')+'"></span>';
        return '<div class="card">'+
            '<span class="k">Building your picture</span>'+
            '<h3>Still learning how you\'re built</h3>'+
            '<p class="d">Every check-in is a dot. Once there are enough of them, the dots start '+
            'showing patterns that are yours alone — nobody else\'s.</p>'+
            '<div class="fill"><div class="cnt"><b>9</b> of 21 check-ins</div></div>'+
            '<div class="dots">'+dots+'</div>'+
            '<p class="d" style="margin-top:13px">About <b>8 more</b> and the first patterns start to appear.</p>'+
          '</div>'+
          '<div class="card">'+
            '<span class="k">What you\'ve noticed so far</span>'+
            '<h3>Your most-named spots</h3>'+
            '<p class="d">📍 Right calf — <b>tight / stiff</b>, 4 times<br>'+
            '📍 Lower back — <b>sore / achy</b>, 2 times</p>'+
            '<p class="d" style="color:var(--muted);margin-top:9px">No conclusions yet — just what you\'ve said.</p>'+
          '</div>'+
          '<div class="story locked">'+
            '<h3>📮 Your weekly story</h3>'+
            '<p>Unlocks after your first full week</p>'+
          '</div>';
      }
    },

    /* ── weeks 4–8 ── */
    early:{
      label:'Weeks 4–8 · First hunches',
      sub:'Week 6 · 27 check-ins',
      why:'Enough data for a hunch, not for a claim. So: <b>one</b> insight, hedged in its wording, '+
           'with 👍/🤔 attached. The thumbs do three jobs — she practises judgement (week 6 of the journey), '+
           'the model learns which insights land, and "you stay the expert on you" becomes a thing you can tap.',
      html:function(){
        return '<div class="card">'+
            '<span class="k">How well you read yourself</span>'+
            '<h3>Your read is getting sharper</h3>'+
            '<p class="d">How close your prediction lands to what your body actually says — '+
            'week by week. No score, just the shape of it.</p>'+
            trend([0.30,0.42,0.36,0.55,0.50,0.62])+
            '<div class="legendline"><span>Week 1</span><span>Week 6</span></div>'+
          '</div>'+
          CAVEAT+
          '<div class="card">'+
            '<span class="k">First hunch</span>'+
            '<h3>Something\'s starting to show</h3>'+
            insight('🌙','It\'s early, but your <b>energy seems to dip in the few days before your period</b> — '+
              'and climb again after. Worth watching over the next few weeks to see if it holds.','e1')+
          '</div>'+
          '<div class="story">'+
            '<h3>📮 Your weekly story</h3>'+
            '<p>Something you can hand to a coach or a parent</p>'+
            '<button>Put one together</button>'+
          '</div>';
      }
    },

    /* ── week 9+ ── */
    fingerprint:{
      label:'Week 9+ · Your fingerprint',
      sub:'Week 12 · 61 check-ins',
      why:'Now it earns the chart. Note the third insight: it <b>contradicts</b> the cycle reading and points '+
           'at exam weeks. At least one insight per signal must not be about her cycle — an app that explains '+
           'everything about a girl by her cycle does educational harm.',
      html:function(){
        return '<div class="card">'+
            '<span class="k">How well you read yourself</span>'+
            '<h3>Your read keeps getting sharper 🌱</h3>'+
            trend([0.30,0.42,0.36,0.55,0.50,0.62,0.58,0.70,0.74,0.71,0.80,0.83])+
            '<div class="legendline"><span>Week 1</span><span>Week 12</span></div>'+
          '</div>'+
          '<div class="card">'+
            '<span class="k">Your patterns</span>'+
            '<div class="sig" id="sig">'+
              '<button data-s="energy" aria-pressed="true">🔋 Energy</button>'+
              '<button data-s="focus">🎯 Focus</button>'+
              '<button data-s="mood">💜 Mood</button>'+
              '<button data-s="pain">🩹 Aches</button>'+
            '</div>'+
            '<div id="chartHost">'+chart(series(84,true))+'</div>'+
            '<div class="legend">'+
              '<span><i style="background:var(--menstrual)"></i>Period</span>'+
              '<span><i style="background:var(--follicular)"></i>Follicular</span>'+
              '<span><i style="background:var(--ovulation)"></i>Ovulation</span>'+
              '<span><i style="background:var(--luteal)"></i>Luteal</span>'+
            '</div>'+
            '<div class="phase">'+
              '<div><div class="n">PERIOD</div><div class="v">2.8</div></div>'+
              '<div><div class="n">FOLLIC.</div><div class="v">4.3</div></div>'+
              '<div><div class="n">OVUL.</div><div class="v">4.5</div></div>'+
              '<div><div class="n">LUTEAL</div><div class="v">3.2</div></div>'+
            '</div>'+
            '<p class="d" style="color:var(--muted);margin-top:10px;font-size:12px">'+
            'Bands are approximate — at your age cycles are still settling, so treat them as a rough map.</p>'+
          '</div>'+
          CAVEAT+
          '<div class="card">'+
            '<span class="k">🔎 What BAB has spotted</span>'+
            insight('🌙','Your <b>energy dips in the few days before your period</b> and during it — then climbs '+
              'back after. That\'s your rhythm, not a slump. Plan a Gentle day or two there.','i1')+
            insight('☀️','You\'re <b>most energised in your follicular and ovulation phases</b> — a great window '+
              'to chase hard, Upbeat sessions.','i2')+
            insight('📚','Two of your lowest weeks lined up with <b>exam weeks, not your cycle</b> — proof that '+
              'school stress spends from the same battery as training.','i3')+
          '</div>'+
          '<div class="story">'+
            '<h3>📮 Your weekly story</h3>'+
            '<p>Something you can hand to a coach or a parent</p>'+
            '<button>Put one together</button>'+
          '</div>';
      }
    }
  };

  var SERIES={energy:series(84,true),focus:series(84,true),mood:series(84,false),pain:series(84,false)};

  function wire(){
    // insight feedback
    document.querySelectorAll('.ins .fb').forEach(function(fb){
      fb.querySelectorAll('button').forEach(function(b){
        b.onclick=function(){
          fb.querySelectorAll('button').forEach(function(o){o.classList.remove('picked');});
          b.classList.add('picked');
        };
      });
    });
    // signal switcher
    var sig=document.getElementById('sig');
    if(sig) sig.querySelectorAll('button').forEach(function(b){
      b.onclick=function(){
        sig.querySelectorAll('button').forEach(function(o){o.setAttribute('aria-pressed','false');});
        b.setAttribute('aria-pressed','true');
        document.getElementById('chartHost').innerHTML=chart(SERIES[b.getAttribute('data-s')]);
      };
    });
  }

  var ORDER=['collecting','early','fingerprint'];
  var sw=document.getElementById('switch');
  ORDER.forEach(function(k,i){
    var b=document.createElement('button'); b.type='button'; b.textContent=STAGES[k].label;
    b.setAttribute('aria-pressed', i===0?'true':'false');
    b.onclick=function(){
      sw.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed','false');});
      b.setAttribute('aria-pressed','true'); show(k);
    };
    sw.appendChild(b);
  });

  function show(k){
    var s=STAGES[k];
    document.getElementById('sub').textContent=s.sub;
    document.getElementById('view').innerHTML=s.html();
    document.getElementById('why').innerHTML=s.why;
    wire();
  }
  show('collecting');
})();
</script>
</body>
</html>
