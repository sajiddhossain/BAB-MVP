<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAB · My rhythm</title>
<style>
  :root{
    --bg:#0e1322; --panel:#161d30; --panel2:#1d2740; --ink:#eef2fb; --muted:#98a4c2; --soft:#c3ccdf;
    --line:#293450; --accent:#ff9f45; --accent2:#ffd17a;
    --power:#ff9f45; --sharpen:#24b6b0; --restore:#8b83f5; --care:#e86a92;
    --powerb:rgba(255,159,69,.14); --sharpenb:rgba(36,182,176,.14); --restoreb:rgba(139,131,245,.16); --careb:rgba(232,106,146,.14);
    /* le quattro fasi — sempre desaturate: stanno dietro, non davanti */
    --menstrual:#e86a92; --follicular:#24b6b0; --ovulation:#ffd17a; --luteal:#8b83f5;
    --shadow:0 12px 34px rgba(0,0,0,.38);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#eef1f9; --panel:#ffffff; --panel2:#f1f4fc; --ink:#151d2f; --muted:#5c6a86; --soft:#3d4a61;
      --line:#e3e8f4; --shadow:0 12px 34px rgba(30,45,90,.10);
      --powerb:rgba(255,159,69,.13); --sharpenb:rgba(36,182,176,.12); --restoreb:rgba(139,131,245,.13); --careb:rgba(232,106,146,.12);}
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;padding:14px 12px 40px}

  /* ── demo chrome ── */
  .demo{max-width:820px;margin:0 auto 16px;background:var(--panel);border:1px dashed var(--line);
    border-radius:14px;padding:13px 15px}
  .demo h6{margin:0 0 8px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:850}
  .demo .row{display:flex;flex-wrap:wrap;gap:7px}
  .demo button{border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:999px;
    padding:8px 13px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:.12s}
  .demo button:hover{border-color:var(--accent)}
  .demo button[aria-pressed="true"]{border-color:var(--accent);background:var(--powerb);color:var(--accent)}
  .demo p{margin:9px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}

  /* ── phone ── */
  .phone{max-width:400px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:26px;
    box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:700px}
  .top{padding:16px 16px 6px}
  .top h1{margin:0;font-size:22px;font-weight:850;letter-spacing:-.02em}
  .top .s{font-size:12.5px;color:var(--muted)}
  .body{flex:1;padding:10px 16px 20px;overflow:auto}
  .tabs{display:flex;border-top:1px solid var(--line);background:var(--panel)}
  .tabs button{flex:1;background:none;border:none;color:var(--muted);font:inherit;font-size:11px;font-weight:750;
    padding:11px 4px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
  .tabs button .i{font-size:19px;line-height:1}
  .tabs button.on{color:var(--accent)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:13px}
  .card .k{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:850}

  /* ── la card della fase ── */
  .phasecard{border-radius:18px;padding:18px;margin-bottom:13px;border:1.5px solid var(--line);background:var(--panel)}
  .phasecard .lead{font-size:13px;color:var(--muted);margin:0 0 4px}
  .phasehead{display:flex;align-items:center;gap:13px}
  .phasehead .em{font-size:38px;line-height:1}
  .phasehead .nm{font-size:22px;font-weight:850;letter-spacing:-.01em}
  .phasehead .day{font-size:12.5px;color:var(--muted);font-weight:650;margin-top:1px}
  .phasetext{margin:13px 0 0;font-size:14.5px;line-height:1.55;color:var(--soft)}

  /* ── la striscia delle fasi ──
     I bordi sono SFUMATI di proposito: nei primi anni dopo il menarca i cicli
     sono irregolari, e un confine netto comunicherebbe una precisione che non
     abbiamo. Il marcatore "oggi" è un alone morbido, non una linea. */
  .strip{margin-top:16px}
  .stripbar{position:relative;height:34px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .stripbar .seg{position:absolute;top:0;bottom:0}
  .today{position:absolute;top:-5px;bottom:-5px;width:34px;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 70%)}
  .todaydot{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;
    background:var(--ink);border:2.5px solid var(--bg);box-shadow:0 0 0 2px rgba(255,255,255,.35)}
  .striplbl{display:flex;justify-content:space-between;margin-top:7px;font-size:10.5px;color:var(--muted);font-weight:650}
  .striplegend{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px;font-size:11px;color:var(--muted)}
  .striplegend span{display:inline-flex;align-items:center;gap:5px}
  .striplegend i{width:10px;height:10px;border-radius:3px;display:inline-block;opacity:.75}

  /* ── incertezza: si mostra, non si nasconde ── */
  .uncert{margin-top:13px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--restore);
    border-radius:11px;padding:12px 13px;font-size:13px;color:var(--soft);line-height:1.5}
  .uncert b{color:var(--restore)}
  .mapnote{margin-top:11px;text-align:center;font-size:12.5px;color:var(--muted);font-weight:650}

  /* ── accordion ── */
  details.learn{margin-top:13px;border-top:1px solid var(--line);padding-top:12px}
  details.learn summary{cursor:pointer;font-size:13.5px;font-weight:750;color:var(--accent);list-style:none;user-select:none;min-height:44px;display:flex;align-items:center}
  details.learn summary::-webkit-details-marker{display:none}
  details.learn summary::before{content:"▸ ";margin-right:4px}
  details.learn[open] summary::before{content:"▾ "}
  details.learn .b{font-size:13.5px;color:var(--soft);line-height:1.55}
  details.learn .b p{margin:9px 0}
  details.learn .b b{color:var(--ink)}

  .actions{display:flex;gap:8px;margin-top:4px}
  .actions button{flex:1;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;
    padding:12px;font:inherit;font-size:13px;font-weight:750;cursor:pointer;min-height:44px}
  .actions button:hover{border-color:var(--accent)}

  /* ── stati speciali ── */
  .quietcard{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:18px;text-align:center}
  .quietcard .em{font-size:34px}
  .quietcard h3{margin:9px 0 6px;font-size:17px;font-weight:850}
  .quietcard p{margin:0;font-size:13.5px;color:var(--soft);line-height:1.55}
  .quietcard button{margin-top:14px;width:100%;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);
    border-radius:12px;padding:12px;font:inherit;font-weight:750;cursor:pointer;min-height:44px}
  .note{max-width:820px;margin:16px auto 0;font-size:12.5px;color:var(--muted);line-height:1.6;text-align:center}
</style>
</head>
<body>

<div class="demo">
  <h6>Demo · la stessa vista in situazioni diverse</h6>
  <div class="row" id="switch"></div>
  <p id="why"></p>
</div>

<div class="phone">
  <div class="top">
    <h1>My rhythm</h1>
    <div class="s" id="sub"></div>
  </div>
  <div class="body" id="view"></div>
  <div class="tabs">
    <button><span class="i">☀️</span>Today</button>
    <button><span class="i">🗺️</span>Journey</button>
    <button class="on"><span class="i">📈</span>Me</button>
  </div>
</div>

<p class="note">Restituisce qualcosa dal <b>giorno uno</b> in cambio del dato più intimo
che l'app chiede. Nessun conto alla rovescia, nessuna previsione.</p>

<script>
(function(){

  /* ════════════════════════════════════════════════════════════════════
     Le quattro fasi. Il copy è quello già scritto nel blocco Rhythm dei
     check-in — non si riscrive, si riusa: è lo stesso vocabolario.
     ════════════════════════════════════════════════════════════════════ */
  var PHASES = {
    menstrual: {
      em:'🩸', name:'Menstrual', col:'--menstrual',
      text:"Your bleeding days. Energy often dips and you might feel like taking it easier — that's okay. You lose a little iron now, so iron-rich food (meat, beans, lentils, leafy greens) helps."
    },
    follicular: {
      em:'🌱', name:'Follicular', col:'--follicular',
      text:"Energy and mood usually climb as your body gears back up. You may feel strong, fresh and up for pushing — a lovely window, if your channels agree."
    },
    ovulation: {
      em:'☀️', name:'Ovulation', col:'--ovulation',
      text:"Often your peak: your highest energy, strength and confidence. Enjoy it, and warm up well."
    },
    luteal: {
      em:'🌙', name:'Luteal', col:'--luteal',
      text:"Energy can ease off and the luteal munchies arrive — you feel hungrier because your metabolism ticks up, so your body genuinely needs more fuel. Your mood can shift too. Feed it, rest a little more, and be kind to yourself."
    }
  };
  var ORDER = ['menstrual','follicular','ovulation','luteal'];

  /* Confini medi. Sono medie, e il disegno lo dice: bordi sfumati, mai netti. */
  var BOUNDS = [
    ['menstrual',   0,  5],
    ['follicular',  5, 12],
    ['ovulation',  12, 16],
    ['luteal',     16, 29]
  ];

  function phaseForDay(cd, len){
    var scale = len / 29;                       // adatta i confini alla SUA lunghezza
    for (var i=0;i<BOUNDS.length;i++){
      var b = BOUNDS[i];
      if (cd >= b[1]*scale && cd < b[2]*scale) return b[0];
    }
    return 'luteal';
  }

  /* ── incertezza: quanto ci possiamo fidare di questa lettura ──
     Dipende da quante date ha dato e da quanto sono regolari. Non è un
     dettaglio grafico: è la differenza fra "mappa" e "orario". */
  function readCycle(dates, today){
    var d = dates.slice().sort();               // ISO, quindi ordinabili come stringhe
    var starts = d.map(function(x){ return new Date(x+'T00:00:00'); });
    var last = starts[starts.length-1];
    var gaps = [];
    for (var i=1;i<starts.length;i++) gaps.push(Math.round((starts[i]-starts[i-1])/864e5));

    var len = gaps.length ? Math.round(gaps.reduce(function(a,b){return a+b;},0)/gaps.length) : 28;
    var spread = gaps.length > 1 ? Math.max.apply(null,gaps) - Math.min.apply(null,gaps) : null;

    var cd = Math.floor((today - last)/864e5);
    // Oltre una lunghezza intera senza una data nuova, non si indovina: si chiede.
    var stale = cd >= len + 7;

    var level;
    if (starts.length === 1)            level = 'one';        // una data sola
    else if (spread !== null && spread > 5) level = 'variable';  // cicli molto variabili
    else                                level = 'ok';

    return { cycleDay: cd % len, length: len, spread: spread, level: level,
             stale: stale, nDates: starts.length,
             phase: phaseForDay(cd % len, len) };
  }

  /* ── la striscia, con i bordi sfumati ── */
  function strip(read){
    var scale = read.length / 29;
    var segs = BOUNDS.map(function(b){
      var a = (b[1]*scale/read.length)*100, z = (b[2]*scale/read.length)*100;
      return { key:b[0], a:Math.max(0,a), z:Math.min(100,z) };
    });
    // più incerta è la lettura, più larga è la sfumatura fra una fase e l'altra
    var feather = read.level === 'ok' ? 5 : (read.level === 'variable' ? 11 : 14);

    var html = '<div class="strip"><div class="stripbar">';
    segs.forEach(function(s){
      var w = s.z - s.a;
      var c = 'var('+PHASES[s.key].col+')';
      html += '<div class="seg" style="left:'+s.a.toFixed(1)+'%;width:'+w.toFixed(1)+'%;'+
        'background:linear-gradient(90deg, transparent 0%, '+c+' '+feather+'%, '+c+' '+(100-feather)+'%, transparent 100%);'+
        'opacity:.55"></div>';
    });
    var pos = (read.cycleDay / read.length) * 100;
    html += '<div class="today" style="left:calc('+pos.toFixed(1)+'% - 17px)"></div>';
    html += '<div class="todaydot" style="left:'+pos.toFixed(1)+'%"></div>';
    html += '</div>';
    html += '<div class="striplbl"><span>Day 1</span><span>Today · day '+(read.cycleDay+1)+'</span><span>~'+read.length+'</span></div>';
    html += '<div class="striplegend">'+ORDER.map(function(k){
      return '<span><i style="background:var('+PHASES[k].col+')"></i>'+PHASES[k].name+'</span>';
    }).join('')+'</div></div>';
    return html;
  }

  /* ── il testo sull'incertezza, per livello ── */
  var UNCERT = {
    one: "You've given BAB <b>one date</b> so far, so this is a rough guess. Add another one or two and it gets a lot better.",
    variable: "Your last cycles were <b>{spread} days apart at their widest</b> — that's completely normal at your age, and it means this is a loose read rather than a precise one.",
    ok: "Based on the <b>{n} dates</b> you gave, your cycle runs around <b>{len} days</b>. It'll keep shifting — that's normal while it settles."
  };

  function uncertText(read){
    return UNCERT[read.level]
      .replace('{spread}', read.spread)
      .replace('{n}', read.nDates)
      .replace('{len}', read.length);
  }

  var LEARN =
    '<details class="learn"><summary>What the four phases can feel like 👀</summary>'+
    '<div class="b">'+
    "<p>Everyone's different, and while your cycle is still settling the timing isn't regular yet — so think of these as what each phase can <em>feel</em> like, not a fixed schedule:</p>"+
    ORDER.map(function(k){
      return '<p><b>'+PHASES[k].em+' '+PHASES[k].name+'.</b> '+PHASES[k].text+'</p>';
    }).join('')+
    "<p>None of this is a rule — it's a map. Noticing where you are helps you <b>work with your body instead of against it.</b></p>"+
    '</div></details>';

  /* ════════════════════════════════════════════════════════════════════
     Le situazioni
     ════════════════════════════════════════════════════════════════════ */
  var TODAY = new Date('2026-05-15T00:00:00');

  function tracking(dates, label){
    var read = readCycle(dates, TODAY);
    var p = PHASES[read.phase];

    if (read.stale){
      return '<div class="card">'+
        '<span class="k">Your rhythm</span>'+
        '<div class="quietcard" style="border:none;padding:14px 0 0;text-align:left">'+
        '<h3 style="margin-top:0">It\'s been a while</h3>'+
        '<p>Your last date was more than a full cycle ago, so BAB won\'t guess where you are — '+
        'guessing would just be making something up. Pop in your latest date and the map comes back.</p>'+
        '</div>'+
        '<div class="actions" style="margin-top:14px"><button>Add my latest date</button></div>'+
        LEARN + '</div>';
    }

    return '<div class="phasecard" style="border-color:var('+p.col+');background:'+
        'linear-gradient(180deg, color-mix(in srgb, var('+p.col+') 14%, transparent), transparent), var(--panel)">'+
        '<p class="lead">Right now you\'re in</p>'+
        '<div class="phasehead"><span class="em">'+p.em+'</span>'+
          '<div><div class="nm">'+p.name+'</div>'+
          '<div class="day">around day '+(read.cycleDay+1)+' of your cycle</div></div></div>'+
        '<p class="phasetext">'+p.text+'</p>'+
        strip(read)+
      '</div>'+
      '<div class="card">'+
        '<div class="uncert">'+uncertText(read)+'</div>'+
        '<p class="mapnote">It\'s a map, not a timetable. 🗺️</p>'+
        '<div class="actions" style="margin-top:13px">'+
          '<button>Update my dates</button><button>Turn this off</button></div>'+
        LEARN+
      '</div>';
  }

  var STATES = {
    follicular: {
      label:'🌱 Mid-cycle, regular',
      sub:'3 dates given · 28 days apart',
      why:'Il caso normale. La fase è nominata e il testo dice cosa <b>può</b> voler dire, mai cosa farà. '+
          'La striscia ha i bordi sfumati e "oggi" è un alone, non una linea: l\'incertezza si vede.',
      html:function(){ return tracking(['2026-03-12','2026-04-09','2026-05-07']); }
    },
    menstrual: {
      label:'🩸 On her period',
      sub:'3 dates given · 28 days apart',
      why:'Stessa vista, fase diversa. Nota che il copy della fase mestruale parla di ferro e di andarci '+
          'più piano — mai di "prestazione ridotta".',
      html:function(){ return tracking(['2026-03-18','2026-04-15','2026-05-13']); }
    },
    luteal: {
      label:'🌙 Late luteal',
      sub:'3 dates given · 29 days apart',
      why:'La fase in cui l\'energia spesso cala. 🔴 Qui la tentazione sarebbe scrivere "il ciclo arriva '+
          'fra 3 giorni". Non si fa: nessun conto alla rovescia, nessuna previsione.',
      html:function(){ return tracking(['2026-02-21','2026-03-22','2026-04-20']); }
    },
    onedate: {
      label:'📍 Only one date',
      sub:'1 date given · everything else is an average',
      why:'Il caso del giorno uno: ha dato una data sola in onboarding. La vista funziona lo stesso, ma '+
          'lo dice — e la sfumatura fra le fasi è molto più larga. L\'onestà è anche l\'invito ad aggiungerne altre.',
      html:function(){ return tracking(['2026-05-02']); }
    },
    variable: {
      label:'〰️ Irregular cycles',
      sub:'3 dates given · 24–35 days apart',
      why:'Cicli molto variabili — normalissimo a quest\'età. La lettura resta, ma il testo lo nomina e '+
          'la sfumatura si allarga. Meglio dire "è una lettura larga" che fingere precisione.',
      html:function(){ return tracking(['2026-02-24','2026-03-31','2026-04-24']); }
    },
    stale: {
      label:'🕰️ No recent date',
      sub:'last date 48 days ago',
      why:'🔴 Oltre una lunghezza intera senza una data nuova, BAB <b>smette di indovinare</b>. Continuare '+
          'sarebbe inventare. Nota che il copy non allarma e non insinua nulla: chiede solo la data.',
      html:function(){ return tracking(['2026-03-28']); }
    },
    notyet: {
      label:'🌱 Not started yet',
      sub:'',
      why:'Su una fascia 11–18 è una risposta frequentissima, e non deve mai sembrare un ripiego. '+
          'Nessun input, nessuna striscia: solo il contenuto educativo, disponibile quando le va.',
      html:function(){
        return '<div class="quietcard">'+
            '<div class="em">🌱</div>'+
            '<h3>Nothing to track yet — and that\'s completely normal</h3>'+
            '<p>Bodies begin on their own timeline, anywhere across these years. '+
            'When yours starts, you can switch this on and BAB will start mapping your rhythm.</p>'+
            '<button>I\'ve started — set it up</button>'+
          '</div>'+
          '<div class="card" style="margin-top:13px">'+
            '<span class="k">Worth knowing anyway</span>'+
            '<p style="margin:6px 0 0;font-size:13.5px;color:var(--soft);line-height:1.55">'+
            'When your period does arrive, your body starts moving through four phases — and that rhythm '+
            'touches your energy, mood, sleep and focus. Here\'s what each one can feel like, so none of '+
            'it comes as a surprise.</p>'+
            LEARN+
          '</div>';
      }
    },
    undisclosed: {
      label:'☁️ Rather not say',
      sub:'',
      why:'🔴 Ha scelto di non dirlo, quindi il blocco <b>sparisce</b> — non si mostra svuotato, non si '+
          'insiste, non si rimanda. La riattivazione è in impostazioni, dove la cerca lei se le va.',
      html:function(){
        return '<div class="quietcard">'+
            '<div class="em">☁️</div>'+
            '<h3>This part is switched off</h3>'+
            '<p>You chose not to share your cycle, and everything else in BAB works exactly the same. '+
            'You can switch it on any time in Settings — no rush, and no reminders from us.</p>'+
          '</div>';
      }
    }
  };

  var ORDER_S = ['follicular','menstrual','luteal','onedate','variable','stale','notyet','undisclosed'];

  var sw = document.getElementById('switch');
  ORDER_S.forEach(function(k,i){
    var b=document.createElement('button'); b.type='button'; b.textContent=STATES[k].label;
    b.setAttribute('aria-pressed', i===0?'true':'false');
    b.onclick=function(){
      sw.querySelectorAll('button').forEach(function(o){o.setAttribute('aria-pressed','false');});
      b.setAttribute('aria-pressed','true'); show(k);
    };
    sw.appendChild(b);
  });

  function show(k){
    var s=STATES[k];
    document.getElementById('sub').textContent=s.sub;
    document.getElementById('view').innerHTML=s.html();
    document.getElementById('why').innerHTML=s.why;
  }
  show('follicular');
})();
</script>
</body>
</html>
